name: CI tap

on:
  push:
    branches: [main]
    paths:
      - "tap/**"
      - ".github/workflows/tap-ci.yml"
  pull_request:
    paths:
      - "tap/**"
      - ".github/workflows/tap-ci.yml"

permissions:
  contents: read

concurrency:
  group: tap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: tap-core + tap-application (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tap -> target

      - name: Format check (workspace)
        working-directory: tap
        run: cargo fmt --all --check

      # tap-core (pure domain) and tap-application (engine) are platform-agnostic
      # and build/test on Linux.
      - name: Clippy (tap-core + tap-application)
        working-directory: tap
        run: cargo clippy -p tap-core -p tap-application --all-targets -- -D warnings

      - name: Test (tap-core + tap-application)
        working-directory: tap
        run: cargo test -p tap-core -p tap-application

  platform:
    name: tap-platform + app (macOS compile + lint)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tap -> target

      - name: Clippy (tap-platform)
        working-directory: tap
        run: cargo clippy -p tap-platform --all-targets -- -D warnings

      - name: Clippy (tap-tauri)
        working-directory: tap
        run: cargo clippy -p tap-tauri --all-targets -- -D warnings
