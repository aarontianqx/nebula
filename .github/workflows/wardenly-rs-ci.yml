name: CI wardenly-rs

on:
  push:
    branches: [main]
    paths:
      - "wardenly-rs/**"
      - ".github/workflows/wardenly-rs-ci.yml"
  pull_request:
    paths:
      - "wardenly-rs/**"
      - ".github/workflows/wardenly-rs-ci.yml"
  # Path filters are skipped by GitHub when a push diff cannot be computed
  # (force push / >300 changed files); allow manual runs as an escape hatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wardenly-rs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: wardenly-rs (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Icons are stored in Git LFS; tauri's generate_context! reads them
      # at compile time, so pull the real files (not pointers) selectively.
      - name: Fetch LFS assets (tauri icons)
        run: git lfs pull --include="wardenly-rs/src-tauri/icons/**"

      # Tauri on Linux links against webkit2gtk/gtk; without these dev
      # packages glib-sys/gobject-sys fail at pkg-config during clippy.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: wardenly-rs/src-tauri -> target

      # wardenly-rs is a single Tauri app crate (no domain/platform split).
      # tauri-build does not require the frontend dist for cargo check/clippy/test,
      # so the crate builds on Linux without bundling the UI first.
      - name: Format check
        working-directory: wardenly-rs/src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: wardenly-rs/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: wardenly-rs/src-tauri
        run: cargo test

  frontend:
    name: wardenly-rs frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: wardenly-rs/yarn.lock

      - name: Install dependencies
        working-directory: wardenly-rs
        run: yarn install --frozen-lockfile

      # No standalone lint/typecheck scripts here; `yarn build` runs
      # `tsc && vite build`, which typechecks and bundles in one step.
      - name: Build (tsc + vite)
        working-directory: wardenly-rs
        run: yarn build
