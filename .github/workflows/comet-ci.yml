name: CI comet

on:
  push:
    branches: [main]
    paths:
      - "comet/**"
      - ".github/workflows/comet-ci.yml"
  pull_request:
    paths:
      - "comet/**"
      - ".github/workflows/comet-ci.yml"
  # Path filters are skipped by GitHub when a push diff cannot be computed
  # (force push / >300 changed files); allow manual runs as an escape hatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: comet (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Icons are stored in Git LFS; tauri's generate_context! reads them
      # at compile time, so pull the real files (not pointers) selectively.
      - name: Fetch LFS assets (tauri icons)
        run: git lfs pull --include="comet/src-tauri/icons/**"

      # Tauri on Linux links against webkit2gtk/gtk; without these dev
      # packages glib-sys/gobject-sys fail at pkg-config during clippy.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: comet -> target

      - name: Format check (workspace)
        working-directory: comet
        run: cargo fmt --all --check

      - name: Clippy (workspace)
        working-directory: comet
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        working-directory: comet
        run: cargo test --workspace

  frontend:
    name: comet frontend (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: comet/yarn.lock

      - name: Install dependencies
        working-directory: comet
        run: yarn install --frozen-lockfile

      - name: Typecheck (tsc)
        working-directory: comet
        run: yarn typecheck

      - name: Lint (eslint)
        working-directory: comet
        run: yarn lint
