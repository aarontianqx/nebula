name: Release wardenly-rs

on:
  push:
    tags:
      - "wardenly-rs-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: wardenly-rs/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: wardenly-rs
        run: yarn install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: wardenly-rs
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wardenly-rs-${{ matrix.label }}
          path: |
            wardenly-rs/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            wardenly-rs/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            wardenly-rs/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            wardenly-rs/src-tauri/target/${{ matrix.target }}/release/bundle/**/*setup*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#wardenly-rs-}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Wardenly ${{ steps.version.outputs.version }}"
          files: artifacts/**/*
          generate_release_notes: true
