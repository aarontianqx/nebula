[package]
name = "pulsar-cli"
version = "0.1.0"
description = "Pulsar CLI: run the toolbox from the terminal, scripts and CI"
authors = ["Aaron Tian"]
edition = "2021"

[[bin]]
name = "pulsar"
path = "src/main.rs"

[dependencies]
pulsar-core = { path = "../pulsar-core" }
pulsar-app = { path = "../pulsar-app" }
clap = "4.6.1"
clap_complete = "4.6.5"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
