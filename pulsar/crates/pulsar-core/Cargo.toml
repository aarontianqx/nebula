[package]
name = "pulsar-core"
version = "0.1.0"
description = "Pulsar domain: Tool trait, descriptors, and pure tool implementations"
authors = ["Aaron Tian"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
sha1 = "0.11.0"
sha2 = "0.11.0"
md-5 = "0.11.0"
crc32fast = "1.5.0"
urlencoding = "2.1.3"
hex = "0.4.3"
regex = "1.12.4"
serde_yaml = "0.9.34"
uuid = { version = "1.23.3", features = ["v4", "v7"] }
ulid = "1.2.1"
nanoid = "0.5.0"
serde_json_path = "0.7.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
similar = "3.1.1"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
hmac = "0.13.0"
sqlformat = "0.5.0"
csv = "1.4.0"
cron = "0.17.0"
quick-xml = "0.40.1"
toml = "1.1.2"
bcrypt = "0.19.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
