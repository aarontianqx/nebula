[package]
name = "pulsar"
version = "0.1.0"
description = "Local developer toolbox / workbench"
authors = ["Aaron Tian"]
edition = "2021"

[lib]
name = "pulsar_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "Pulsar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulsar-core = { path = "../crates/pulsar-core" }
pulsar-app = { path = "../crates/pulsar-app" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-clipboard-manager = "2.3.2"
