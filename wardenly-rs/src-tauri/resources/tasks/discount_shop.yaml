# 集市·打折商城（活动开启期间有效）
# 抢购优先级：战魂血玉 > 东海鲛珠 > 琉璃灯盏 > 五花马 > 酒馆礼包
# 全动态设计：ident/价格/限购/门槛由 jslib 按【内容物名称】从当期商品表反查
# （存到 state._js.market），活动换货、换顺序、商品缺失（自动跳过）都不需要改模板。
# 安全设计：
#   1. 全部购买门槛（vip/等级/个人限购/全服余量）客户端先判——服务器对拒绝是静默的；
#   2. 每条购买前刷新一次计数；限购到顶/售罄后谓词失效，自然落到下一商品；
#   3. 计数路径带 default: 0（从没买过 = 条目不存在 = 已购 0）；
#   4. 响应确认核对 index 与计划 ident 一致，防止错单。
name: 集市·打折商城
description: 打折商城抢购：战魂血玉>东海鲛珠>琉璃灯盏>五花马>酒馆礼包，到限购/售罄/vip不足自动结束
on_no_match: { policy: quit }    # 没有可买的 = 任务完成
steps:
  # 计算购买计划：按内容物名反查当期商品，存 state._js.market；活动关闭则直接失败
  - name: plan
    match:
      once: true
    actions:
      - { type: log_state, paths: ["role.gold", "role.vipLevel", "role.level"] }
      - type: call_js
        name: discount_shop_plan
        args: { 战魂血玉: true, 东海鲛珠: true, 琉璃灯盏: true, 五花马: true, 酒馆礼包: true }
        store: market
      - { type: log_state, paths: ["state._js.market"] }

  # 战魂血玉（本期：血玉礼盒，1600金，vip6/lv300，个人限5，全服500）
  - name: buy_战魂血玉
    match:
      conditions:
        - { field: "state._js.market.战魂血玉.ident", op: exists }
        - { field: role.vipLevel, op: gte, value: "$state._js.market.战魂血玉.viplevel" }
        - { field: role.level, op: gte, value: "$state._js.market.战魂血玉.level" }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_INFO.gift.@where(id, eq, "$state._js.market.战魂血玉.ident").@first.buyNum', op: lt, value: "$state._js.market.战魂血玉.limitNum", default: 0 }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_GIFT_BUY_NUM.gift.@where(id, eq, "$state._js.market.战魂血玉.ident").@first.buyNum', op: lt, value: "$state._js.market.战魂血玉.count", default: 0 }
    actions:
      - { type: request, protocol: C_2_S_DISCOUNT_SHOP_INFO, payload: {}, expect: S_2_C_DISCOUNT_SHOP_INFO, timeout: 4s, retries: 1 }
      - type: request
        protocol: C_2_S_DISCOUNT_SHOP_GIFT_BUY
        payload: { ident: "$state._js.market.战魂血玉.ident" }
        expect: S_2_C_DISCOUNT_SHOP_GIFT_BUY
        conditions: [{ field: index, op: eq, value: "$state._js.market.战魂血玉.ident" }]
        timeout: 4s
        retries: 0

  # 东海鲛珠（本期：鲛珠礼包，1200金，vip5/lv200，个人限6，全服299）
  - name: buy_东海鲛珠
    match:
      conditions:
        - { field: "state._js.market.东海鲛珠.ident", op: exists }
        - { field: role.vipLevel, op: gte, value: "$state._js.market.东海鲛珠.viplevel" }
        - { field: role.level, op: gte, value: "$state._js.market.东海鲛珠.level" }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_INFO.gift.@where(id, eq, "$state._js.market.东海鲛珠.ident").@first.buyNum', op: lt, value: "$state._js.market.东海鲛珠.limitNum", default: 0 }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_GIFT_BUY_NUM.gift.@where(id, eq, "$state._js.market.东海鲛珠.ident").@first.buyNum', op: lt, value: "$state._js.market.东海鲛珠.count", default: 0 }
    actions:
      - { type: request, protocol: C_2_S_DISCOUNT_SHOP_INFO, payload: {}, expect: S_2_C_DISCOUNT_SHOP_INFO, timeout: 4s, retries: 1 }
      - type: request
        protocol: C_2_S_DISCOUNT_SHOP_GIFT_BUY
        payload: { ident: "$state._js.market.东海鲛珠.ident" }
        expect: S_2_C_DISCOUNT_SHOP_GIFT_BUY
        conditions: [{ field: index, op: eq, value: "$state._js.market.东海鲛珠.ident" }]
        timeout: 4s
        retries: 0

  # 琉璃灯盏（本期：许愿大礼包，888金，vip2/lv100，个人限1，全服500）
  - name: buy_琉璃灯盏
    match:
      conditions:
        - { field: "state._js.market.琉璃灯盏.ident", op: exists }
        - { field: role.vipLevel, op: gte, value: "$state._js.market.琉璃灯盏.viplevel" }
        - { field: role.level, op: gte, value: "$state._js.market.琉璃灯盏.level" }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_INFO.gift.@where(id, eq, "$state._js.market.琉璃灯盏.ident").@first.buyNum', op: lt, value: "$state._js.market.琉璃灯盏.limitNum", default: 0 }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_GIFT_BUY_NUM.gift.@where(id, eq, "$state._js.market.琉璃灯盏.ident").@first.buyNum', op: lt, value: "$state._js.market.琉璃灯盏.count", default: 0 }
    actions:
      - { type: request, protocol: C_2_S_DISCOUNT_SHOP_INFO, payload: {}, expect: S_2_C_DISCOUNT_SHOP_INFO, timeout: 4s, retries: 1 }
      - type: request
        protocol: C_2_S_DISCOUNT_SHOP_GIFT_BUY
        payload: { ident: "$state._js.market.琉璃灯盏.ident" }
        expect: S_2_C_DISCOUNT_SHOP_GIFT_BUY
        conditions: [{ field: index, op: eq, value: "$state._js.market.琉璃灯盏.ident" }]
        timeout: 4s
        retries: 0

  # 五花马（本期：五花马礼包，225金，vip5/lv100，个人限25，全服9999）
  - name: buy_五花马
    match:
      conditions:
        - { field: "state._js.market.五花马.ident", op: exists }
        - { field: role.vipLevel, op: gte, value: "$state._js.market.五花马.viplevel" }
        - { field: role.level, op: gte, value: "$state._js.market.五花马.level" }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_INFO.gift.@where(id, eq, "$state._js.market.五花马.ident").@first.buyNum', op: lt, value: "$state._js.market.五花马.limitNum", default: 0 }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_GIFT_BUY_NUM.gift.@where(id, eq, "$state._js.market.五花马.ident").@first.buyNum', op: lt, value: "$state._js.market.五花马.count", default: 0 }
    actions:
      - { type: request, protocol: C_2_S_DISCOUNT_SHOP_INFO, payload: {}, expect: S_2_C_DISCOUNT_SHOP_INFO, timeout: 4s, retries: 1 }
      - type: request
        protocol: C_2_S_DISCOUNT_SHOP_GIFT_BUY
        payload: { ident: "$state._js.market.五花马.ident" }
        expect: S_2_C_DISCOUNT_SHOP_GIFT_BUY
        conditions: [{ field: index, op: eq, value: "$state._js.market.五花马.ident" }]
        timeout: 4s
        retries: 0

  # 酒馆礼包（本期：酒馆礼盒，135金，vip1/lv100，个人限10，全服999）
  - name: buy_酒馆礼包
    match:
      conditions:
        - { field: "state._js.market.酒馆礼包.ident", op: exists }
        - { field: role.vipLevel, op: gte, value: "$state._js.market.酒馆礼包.viplevel" }
        - { field: role.level, op: gte, value: "$state._js.market.酒馆礼包.level" }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_INFO.gift.@where(id, eq, "$state._js.market.酒馆礼包.ident").@first.buyNum', op: lt, value: "$state._js.market.酒馆礼包.limitNum", default: 0 }
        - { field: 'state.S_2_C_DISCOUNT_SHOP_GIFT_BUY_NUM.gift.@where(id, eq, "$state._js.market.酒馆礼包.ident").@first.buyNum', op: lt, value: "$state._js.market.酒馆礼包.count", default: 0 }
    actions:
      - { type: request, protocol: C_2_S_DISCOUNT_SHOP_INFO, payload: {}, expect: S_2_C_DISCOUNT_SHOP_INFO, timeout: 4s, retries: 1 }
      - type: request
        protocol: C_2_S_DISCOUNT_SHOP_GIFT_BUY
        payload: { ident: "$state._js.market.酒馆礼包.ident" }
        expect: S_2_C_DISCOUNT_SHOP_GIFT_BUY
        conditions: [{ field: index, op: eq, value: "$state._js.market.酒馆礼包.ident" }]
        timeout: 4s
        retries: 0
