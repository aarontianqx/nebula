# 武魁高塔·天狼（ident=1，boss 220级；每日上限 7 次，达到后性价比骤降自动停止）
# 循环：加载塔信息 → 选白名单服务器中人数最多的队伍加入 → 等开战 →
#       移入 channel 后攻击（≤3 次，永不触发金币路径）→ 结算 → 重新组队
name: 武魁高塔·天狼
description: 武魁高塔组队刷塔：天狼（220级，每日 7 次）
on_no_match: { policy: wait, timeout: 24h }    # 无匹配时等队伍出现（长时间无队伍也不自动退出）
steps:
  # 模板顺序即优先级：终止判定放最前（ident 校验防止读到其他 boss 的信息）
  - name: finish
    match:
      conditions:
        - { field: role._knightTower._teamNumInfo.ident, op: eq, value: 1 }
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: 7 }
    actions:
      - { type: quit, reason: exhausted }

  # teamNumInfo 缺失（首次/战后客户端置 null）→ 重新加载今日次数（纯协议，无 UI 依赖）。
  # 此请求同时承担"退出战斗结算界面"的作用：结算弹窗的确定按钮 = 重新发 TEAM_NUM，
  # 其响应会刷新 teamNumInfo 并把画面切回塔界面（客户端源码确认）。
  # 战中禁止发送：战中到达的 TEAM_NUM 响应不会更新 teamNumInfo，纯属浪费。
  - name: reload_tower_info
    match:
      conditions:
        - { field: role._knightTower._teamNumInfo, op: missing }
        - { field: role._knightTower._isBattle, op: eq, value: false }
    actions:
      - { type: request,
          protocol: C_2_S_KNIGHT_TOWER_TEAM_NUM,
          payload: { ident: 1 },
          expect: S_2_C_KNIGHT_TOWER_TEAM_NUM,
          timeout: 10s,
          retries: 2 }
      # 观测：每次刷新后打印今日次数（ident/num 是 finish 判定的输入）
      - { type: log_state, paths: ["role._knightTower._teamNumInfo"] }

  # 无队且存在白名单服务器（888/11014/11020）的队伍 → 加入人最多的那支
  - name: join_team
    match:
      conditions:
        - { field: role._knightTower._selfteamId, op: eq, value: -1 }
        - { field: "state.S_2_C_KNIGHT_TOWER_TEAM_INFO.battle_team_info_ary.@where(server_id, ends_with, [\"-888\", \"-11014\", \"-11020\"])", op: exists }
    actions:
      # 每次执行先拉最新队伍列表（多人环境下队伍随时满员/开战/解散，旧列表不可用）。
      # 短超时：已入队/战中等状态下服务器可能不回此请求，状态机每轮会自然重试，
      # 长超时只会在开战瞬间造成数十秒失明（实测一场战斗仅 ~8s）。
      - { type: request,
          protocol: C_2_S_KNIGHT_TOWER_TEAM_NUM_INFO,
          payload: { ident: 1 },
          expect: S_2_C_KNIGHT_TOWER_TEAM_INFO,
          timeout: 4s,
          retries: 1 }
      # server_id_len 由桥按 server_id 自动计算（跨服长度不同，不能写死）；
      # JOIN 失败（队伍已没）不判死刑，交回状态机拉新列表选下一队；
      # abort_if：若入队瞬间恰逢开战（RECONNECT 置 isBattle），立即转去战斗
      - type: request
        protocol: C_2_S_KNIGHT_TOWER_TEAM_JOIN
        payload:
          ident: 1
          create_id: "$state.S_2_C_KNIGHT_TOWER_TEAM_INFO.battle_team_info_ary.@where(server_id, ends_with, [\"-888\", \"-11014\", \"-11020\"]).@max(player_count).create_id"
          server_id: "$state.S_2_C_KNIGHT_TOWER_TEAM_INFO.battle_team_info_ary.@where(server_id, ends_with, [\"-888\", \"-11014\", \"-11020\"]).@max(player_count).server_id"
        expect_any: [S_2_C_KNIGHT_TOWER_PLAYER_INFO, S_2_C_KNIGHT_TOWER_PLAYER_COUNT]
        timeout: 5s
        retries: 1
        abort_if:
          - { field: role._knightTower._isBattle, op: eq, value: true }

  # 无队时周期性刷新队伍列表（约 1~2s 一轮），等白名单队伍出现
  - name: refresh_team_info
    match:
      conditions:
        - { field: role._knightTower._selfteamId, op: eq, value: -1 }
        - { field: role._knightTower._teamNumInfo, op: exists }
    actions:
      - { type: request,
          protocol: C_2_S_KNIGHT_TOWER_TEAM_NUM_INFO,
          payload: { ident: 1 },
          expect: S_2_C_KNIGHT_TOWER_TEAM_INFO,
          timeout: 4s,
          retries: 1 }

  # 战斗中且攻击次数未满 → 移入 channel 并攻击
  - name: fight
    match:
      conditions:
        - { field: role._knightTower._isBattle, op: eq, value: true }
        - { field: role._knightTower._fightNum, op: lt, value: 3 }
    actions:
      # 观测：战斗标志位（isBattle 未复位是"打尸体"的直接证据）
      - { type: log_state, paths: ["role._knightTower._isBattle", "role._knightTower._fightNum", "role._militaryOrder"] }
      # 阵亡复活弹窗兜底（客户端在 fighter 阵亡时自动弹，确定=扣金币！）：
      # 攻击前直接销毁弹窗视图——hide 零回调零消耗，比点"取消"更稳；无弹窗时 no-op
      - { type: eval_js, script: "try{var U=window.__require('UIManager').UIManager.instance;var V=window.__require('ViewEnum').ViewModule;U.hide(V.MESSAGE_BOX_VIEW)}catch(e){};'OK'" }
      - { type: send_protocol, protocol: C_2_S_KNIGHT_TOWER_TEAM_PLAYER_MOVE, payload: { channel: 1 } }
      # 只认"自己名字"的命中广播作为确认（$role.accName 在动作开始时解析一次）——
      # 出手节奏跟随自己的真实命中，不被队友的广播提前释放（防超发触及金币路径）；
      # 战斗结束由 abort_if 兜底（RESULT 后客户端 ~0.3s 内复位 isBattle）
      - type: request
        protocol: C_2_S_KNIGHT_TOWER_TEAM_ATTACK
        expect_any: [S_2_C_KNIGHT_TOWER_PLAYER_ATTACK]
        conditions:
          - { field: name, op: eq, value: "$role.accName" }
        timeout: 8s
        retries: 1
        abort_if:
          - { field: role._knightTower._isBattle, op: eq, value: false }

  # 打满 3 次后留在战中待命（fight 不再匹配）：持续销毁可能弹出的复活确认框，
  # 安静等战斗结束
  - name: battle_idle_dismiss
    match:
      conditions:
        - { field: role._knightTower._isBattle, op: eq, value: true }
        - { field: role._knightTower._fightNum, op: gte, value: 3 }
    actions:
      - { type: eval_js, script: "try{var U=window.__require('UIManager').UIManager.instance;var V=window.__require('ViewEnum').ViewModule;U.hide(V.MESSAGE_BOX_VIEW)}catch(e){};'OK'" }
      - { type: wait, duration: 2s }
