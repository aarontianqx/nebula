# 武魁高塔·穷奇（队长模式，ident=3，每日上限 10 次）
# 循环：加载塔信息 → 无队则建队（开放加入）→ 成员满 8 复核后开战（少一个都不开）→
#       战斗（与队员相同的 3 次攻击规则）→ 结算后重建，直到满 10 次停止。
# 建队等级（chaos_level）真相（2026-09-06 日志实证）：TEAM_NUM 的 chaos_level 解析错位不可靠，
# 优先级 = 现存队伍的 TEAM_INFO.limit_level（队长建队等级的服务器回显）> 静态表顶级难度等级（220）。
# 失败均为服务器静默拒绝、零副作用，下轮换新值重试。
name: 武魁高塔·穷奇（队长）
description: 队长模式：自动建队 → 满 8 人复核开战 → 战斗 → 循环重建，满 10 次停止
on_no_match: { policy: wait, timeout: 24h }    # 等人加入是慢过程，一直等
steps:
  # 模板顺序即优先级：终止判定放最前
  - name: finish
    match:
      conditions:
        - { field: role._knightTower._teamNumInfo.ident, op: eq, value: 3 }
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: 10 }
    actions:
      - { type: quit, reason: exhausted }

  # teamNumInfo 缺失（首次/战后客户端置 null）→ 重新加载今日次数（同时是"退出结算画面"）
  - name: reload_tower_info
    match:
      conditions:
        - { field: role._knightTower._teamNumInfo, op: missing }
        - { field: role._knightTower._isBattle, op: eq, value: false }
    actions:
      - { type: request,
          protocol: C_2_S_KNIGHT_TOWER_TEAM_NUM,
          payload: { ident: 3 },
          expect: S_2_C_KNIGHT_TOWER_TEAM_NUM,
          timeout: 10s,
          retries: 2 }
      - { type: log_state, paths: ["role._knightTower._teamNumInfo"] }

  # 建队（有现存队伍时）：以队伍列表里回显的 boss 等级为准（最可靠）
  - name: create_team
    match:
      conditions:
        - { field: role._knightTower._selfteamId, op: eq, value: -1 }
        - { field: role._knightTower._teamNumInfo.ident, op: eq, value: 3 }
        - { field: role._knightTower._teamNumInfo.num, op: lt, value: 10 }
        - { field: state.S_2_C_KNIGHT_TOWER_TEAM_INFO.battle_team_info_ary.@first.limit_level, op: exists }
    actions:
      # 先刷新队伍列表（等级随时变），再用最新回显值建队
      - { type: request,
          protocol: C_2_S_KNIGHT_TOWER_TEAM_NUM_INFO,
          payload: { ident: 3 },
          expect: S_2_C_KNIGHT_TOWER_TEAM_INFO,
          timeout: 5s,
          retries: 1 }
      - { type: send_protocol, protocol: C_2_S_KNIGHT_TOWER_SET_CUR_BOSS_ID,
          payload: { boss_level: "$state.S_2_C_KNIGHT_TOWER_TEAM_INFO.battle_team_info_ary.@first.limit_level" } }
      - type: request
        protocol: C_2_S_KNIGHT_TOWER_TEAM_CREATE
        payload:
          ident: 3
          limit_level: 1
          server_limit: false
          chaos_level: "$state.S_2_C_KNIGHT_TOWER_TEAM_INFO.battle_team_info_ary.@first.limit_level"
        expect_any: [S_2_C_KNIGHT_TOWER_PLAYER_INFO, S_2_C_KNIGHT_TOWER_TEAM_INFO]
        timeout: 6s
        retries: 1
      - { type: log_state, paths: ["role._knightTower._selfteamId"] }
      - { type: wait, duration: 2s }

  # 建队（冷启动：全场无队）：用静态表顶级难度等级（穷奇=220 混沌=300 穷奇=350 饕餮=400）
  - name: create_team_static
    match:
      conditions:
        - { field: role._knightTower._selfteamId, op: eq, value: -1 }
        - { field: role._knightTower._teamNumInfo.ident, op: eq, value: 3 }
        - { field: role._knightTower._teamNumInfo.num, op: lt, value: 10 }
        - { field: state.S_2_C_KNIGHT_TOWER_TEAM_INFO.battle_team_info_ary.@first.limit_level, op: missing }
    actions:
      - { type: request,
          protocol: C_2_S_KNIGHT_TOWER_TEAM_NUM_INFO,
          payload: { ident: 3 },
          expect: S_2_C_KNIGHT_TOWER_TEAM_INFO,
          timeout: 5s,
          retries: 1 }
      - { type: send_protocol, protocol: C_2_S_KNIGHT_TOWER_SET_CUR_BOSS_ID,
          payload: { boss_level: 350 } }
      - type: request
        protocol: C_2_S_KNIGHT_TOWER_TEAM_CREATE
        payload:
          ident: 3
          limit_level: 1
          server_limit: false
          chaos_level: 350
        expect_any: [S_2_C_KNIGHT_TOWER_PLAYER_INFO, S_2_C_KNIGHT_TOWER_TEAM_INFO]
        timeout: 6s
        retries: 1
      - { type: log_state, paths: ["role._knightTower._selfteamId"] }
      - { type: wait, duration: 5s }

  # 队长待命：满 8 人才开战。成员名单是推送驱动的（入队/退队都即时刷新
  # PLAYER_INFO），abort_if 是发送前的最后一道闸：复核发现掉人就不发 START。
  # 注意：C_2_S_TEAM_PLAYER_INFO 主动拉取无响应（仅开战/入队时下发），不要用它复核
  - name: start_when_full
    match:
      conditions:
        - { field: role._knightTower._selfteamId, op: gte, value: 0 }
        - { field: role._knightTower._isBattle, op: eq, value: false }
        - { field: state.S_2_C_KNIGHT_TOWER_PLAYER_INFO.count, op: gte, value: 8 }
        - { field: state.S_2_C_KNIGHT_TOWER_PLAYER_INFO.create_id, op: eq, value: "$role._knightTower._selfteamId" }
    actions:
      - type: request
        protocol: C_2_S_KNIGHT_TOWER_TEAM_START
        payload: {}
        expect: S_2_C_KNIGHT_TOWER_TEAM_START
        timeout: 10s
        retries: 1
        abort_if:
          - { field: state.S_2_C_KNIGHT_TOWER_PLAYER_INFO.count, op: lt, value: 8 }

  # 战斗中且攻击次数未满 → 移入 channel 并攻击（与队员相同的 3 次攻击规则）
  - name: fight
    match:
      conditions:
        - { field: role._knightTower._isBattle, op: eq, value: true }
        - { field: role._knightTower._fightNum, op: lt, value: 3 }
    actions:
      - { type: log_state, paths: ["role._knightTower._isBattle", "role._knightTower._fightNum", "role._militaryOrder"] }
      # 阵亡复活弹窗兜底（确定=扣金币，绝不点；hide 零回调零消耗）
      - { type: eval_js, script: "try{var U=window.__require('UIManager').UIManager.instance;var V=window.__require('ViewEnum').ViewModule;U.hide(V.MESSAGE_BOX_VIEW)}catch(e){};'OK'" }
      - { type: send_protocol, protocol: C_2_S_KNIGHT_TOWER_TEAM_PLAYER_MOVE, payload: { channel: 1 } }
      - type: request
        protocol: C_2_S_KNIGHT_TOWER_TEAM_ATTACK
        expect_any: [S_2_C_KNIGHT_TOWER_PLAYER_ATTACK]
        conditions:
          - { field: name, op: eq, value: "$role.accName" }
        timeout: 8s
        retries: 1
        abort_if:
          - { field: role._knightTower._isBattle, op: eq, value: false }

  # 打满 3 次后留在战中待命：持续销毁可能弹出的复活确认框，安静等结束
  - name: battle_idle_dismiss
    match:
      conditions:
        - { field: role._knightTower._isBattle, op: eq, value: true }
        - { field: role._knightTower._fightNum, op: gte, value: 3 }
    actions:
      - { type: eval_js, script: "try{var U=window.__require('UIManager').UIManager.instance;var V=window.__require('ViewEnum').ViewModule;U.hide(V.MESSAGE_BOX_VIEW)}catch(e){};'OK'" }
      - { type: wait, duration: 2s }
