name: Join Tower
description: Automatically join tower battles
version: "1.0"
author: System
steps:
  - scene: main_city
    timeout: 5s
    actions:
      - type: click
        points:
          - {x: 674, y: 15}
      - type: wait
        duration: 1s
      - type: click
        points:
          - {x: 818, y: 394}
      - type: wait
        duration: 1s

  - scene: main_city_shadow
    timeout: 5s
    actions:
      - type: click
        points:
          - {x: 674, y: 15}
      - type: wait
        duration: 500ms
      - type: click
        points:
          - {x: 674, y: 15}
      - type: wait
        duration: 1s
      - type: click
        points:
          - {x: 818, y: 394}
      - type: wait
        duration: 1s

  - scene: source_of_goods
    timeout: 5s
    actions:
      - type: click
        points:
          - {x: 818, y: 394}
      - type: wait
        duration: 1s

  - scene: tower_entrance_1
    timeout: 5s
    # 天狼：今日次数(num)已达 7 次性价比封顶，或军令耗尽 → 退出
    # (等价原 OCR 判定 "used > 7 || used > total"，used=num+1, total=军令)
    stateRule:
      any: true
      conditions:
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: 7 }
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: "$role._militaryOrder" }
      action: quit_exhausted
    actions:
      - type: loop
        count: -1
        interval: 800ms
        actions:
          - type: click
            points:
              - {x: 546, y: 679}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 726, y: 194}
          - type: wait
            duration: 300ms
          - type: click
            points:
              - {x: 726, y: 314}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 394, y: 447}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 538, y: 420}
          - type: wait
            duration: 1s
          - type: check_scene

  - scene: tower_entrance_2
    timeout: 5s
    # 后续 boss：10 次封顶（同入口 1 的等价替换）
    stateRule:
      any: true
      conditions:
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: 10 }
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: "$role._militaryOrder" }
      action: quit_exhausted
    actions:
      - type: loop
        count: -1
        interval: 800ms
        actions:
          - type: click
            points:
              - {x: 546, y: 679}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 726, y: 194}
          - type: wait
            duration: 300ms
          - type: click
            points:
              - {x: 726, y: 314}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 394, y: 447}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 538, y: 420}
          - type: wait
            duration: 1s
          - type: check_scene

  - scene: tower_entrance_3
    timeout: 5s
    # 后续 boss：10 次封顶（同入口 1 的等价替换）
    stateRule:
      any: true
      conditions:
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: 10 }
        - { field: role._knightTower._teamNumInfo.num, op: gte, value: "$role._militaryOrder" }
      action: quit_exhausted
    actions:
      - type: loop
        count: -1
        interval: 800ms
        actions:
          - type: click
            points:
              - {x: 546, y: 679}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 726, y: 194}
          - type: wait
            duration: 300ms
          - type: click
            points:
              - {x: 726, y: 314}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 394, y: 447}
          - type: wait
            duration: 1s
          - type: click
            points:
              - {x: 538, y: 420}
          - type: wait
            duration: 1s
          - type: check_scene
