[package]
name = "comet"
version = "0.1.0"
description = "Lightweight desktop pet"
authors = ["Aaron Tian"]
edition = "2021"

[lib]
name = "comet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "Comet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.39.5+ 需要 rustc 1.95，当前工具链 1.92，锁 0.37
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
starship-battery = "0.11"
