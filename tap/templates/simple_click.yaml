# Simple Click — click a point repeatedly on a fixed interval.
name: Simple Click
description: Click at a configurable position on a fixed interval
version: '1.0'
variables:
  click_x:
    type: number
    default: 640
    description: X coordinate to click
  click_y:
    type: number
    default: 360
    description: Y coordinate to click
timeline:
- at_ms: 0
  action: !click
    x: '{{ click_x }}'
    y: '{{ click_y }}'
  note: Click the target position
- at_ms: 1000
  action: !wait
    ms: 1000
  note: Wait before the next iteration
run:
  repeat: 0
  start_delay_ms: 3000
  speed: 1.0
