# Loop with Counter — click a fixed number of times using a counter.
# The counter comparison value is a literal; change it in the Code (YAML) view.
name: Loop with Counter
description: Click a fixed number of times using counter control
version: '1.0'
variables:
  click_x:
    type: number
    default: 500
    description: X coordinate to click
  click_y:
    type: number
    default: 300
    description: Y coordinate to click
timeline:
- at_ms: 0
  action: !reset_counter
    key: iteration
  note: Reset the loop counter
- at_ms: 100
  action: !conditional
    condition: !counter
      key: iteration
      op: '>='
      value: 10
    then_action: exit
  note: Stop after 10 iterations
- at_ms: 200
  action: !click
    x: '{{ click_x }}'
    y: '{{ click_y }}'
  note: Perform the click
- at_ms: 400
  action: !incr_counter
    key: iteration
  note: Advance the counter
- at_ms: 500
  action: !wait
    ms: 500
  note: Pause before the next iteration
run:
  repeat: 0
  start_delay_ms: 3000
  speed: 1.0
