[package]
name = "tap-platform"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "tap platform adapters (input injection, input hook for recording)."

[dependencies]
tap-core = { path = "../tap-core" }
thiserror = "2"
tracing = "0.1"
enigo = "0.3"
rdev = "0.5"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# The capture function is looked up by name at run time (see `pixel/macos.rs`). Both crates are
# already in the tree through `core-graphics` and Tauri.
libc = "0.2"
foreign-types = "0.5"
# `NSWorkspace.frontmostApplication`: which application has focus. Already in the dependency
# tree through Tauri, so this adds no new version.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Only the `pixel_probe` example (a ScreenCaptureKit latency spike) uses these; the shipped
# sampler is still `CGWindowListCreateImage`. Pure bindings, no Swift toolchain needed.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCScreenshotManager", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGDataProvider"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
block2 = "0.6"
