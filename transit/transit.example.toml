version = 1
default_provider = "primary"

[server]
listen = "127.0.0.1:8787"
# Remote access: bind a specific server IP or 0.0.0.0:8787, then restart.
shutdown_grace_seconds = 180
connect_timeout_seconds = 15
response_headers_timeout_seconds = 300
stream_idle_timeout_seconds = 180
max_in_flight = 256
max_connections = 1024
max_upload_bytes = 67108864
# Ordinary JSON rewriting: 32 MiB; adapter request limits are configured per route.
max_rewrite_bytes = 33554432

[logging]
# Linux: $XDG_STATE_HOME/transit/logs, otherwise ~/.local/state/transit/logs
# macOS: ~/Library/Logs/transit. Optional absolute override:
# directory = "/var/lib/transit/logs"
level = "debug"
stderr_level = "warn"
rotation = "daily"
retention_days = 14
cleanup_interval_seconds = 3600
error_preview_bytes = 4096

[audit]
# Opt-in metadata only. No request bodies or normal response content in SQLite.
enabled = false
# Default: ${XDG_STATE_HOME:-~/.local/state}/transit/transit.sqlite3
# database = "/var/lib/transit/transit.sqlite3"
retention_days = 90
# Observer limits only; exceeding them does not truncate passthrough responses.
max_request_json_bytes = 8388608
max_response_json_bytes = 8388608
max_sse_event_bytes = 1048576
# Per-response decoded bytes, including long SSE streams; exceeding stops observation only.
max_decoded_response_bytes = 67108864
# Independent two-thread observation runtime. Full queues skip statistics, never wait.
max_pending_observations = 256
# Shared payload budget for queued chunks and retained parser input (excludes codec/JSON overhead).
observer_queue_bytes = 33554432

[capture]
# Optional private debug files, one JSONL per admitted request; independent of audit.
enabled = false
# Default: ${XDG_STATE_HOME:-~/.local/state}/transit/captures
# directory = "/var/lib/transit/captures"
# Empty means all providers; otherwise use names defined below.
providers = []
request_body = false
response_body = true
# Per direction, original body bytes. Exceeding this only truncates the capture.
max_body_bytes = 8388608
# Encoded JSONL storage budget; oldest finished files are removed first.
max_total_bytes = 1073741824
retention_days = 3

[admission]
# Optional public-edge filtering. Rejections return empty 404 without contacting upstream.
strict = false
# Validates presence/format only; does not authenticate the caller or store keys.
require_auth = true
expose_health = false
# Global fixed one-second window; use an ingress for per-IP controls.
requests_per_second = 60

[dashboard]
# Embedded read-only statistics UI; requires audit.enabled=true. No Node.js needed.
enabled = false
# Separate management port. Use a private network or authenticated reverse proxy for remote access.
listen = "127.0.0.1:8788"

# Replace this placeholder origin and model IDs before using a real endpoint.
# Credentials belong in your client; Transit has no API key configuration.
[providers.primary]
origin = "https://api.example.com"
base_path = ""

[providers.primary.model_aliases]
chat-latest = "replace-with-latest-model"
edit-fast = "replace-with-fast-model"

# Example parameters only: confirm support with the selected upstream/model.
# A route must explicitly select this profile; ordinary traffic is unaffected.
[providers.primary.request_profiles.edit_prediction]
set = { thinking = { type = "disabled" } }
remove = ["temperature", "reasoning_effort"]

[providers.secondary]
origin = "https://secondary.example.com"
base_path = "/gateway"

[[routes]]
id = "secondary-direct"
path_prefix = "/secondary"
strip_prefix = true
provider = "secondary"

[[routes]]
id = "zed-edit"
method = "POST"
path = "/zed-edit/v1/completions"
provider = "primary"
# Complete override: provider.base_path is not added to upstream_path.
upstream_path = "/v1/chat/completions"
adapter = "completions_to_chat"
prompt_mode = "fim_qwen"
request_profile = "edit_prediction"
unknown_fields = "reject"
max_request_bytes = 2097152
max_json_response_bytes = 8388608
max_sse_event_bytes = 1048576
